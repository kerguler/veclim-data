proxy_cache_path /var/cache/nginx/api_cache levels=1:2 keys_zone=api_cache:50m inactive=24h max_size=2g;

map $request_uri $api_cache_key {
    default $request_uri;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 80;

    # -----------------------------
    # Compression for JSON results
    # -----------------------------
    gzip on;
    gzip_types application/json application/javascript text/plain application/xml;
    gzip_min_length 1000;

    # Allow localhost dev + production domain
    if ($http_origin ~* "(https://veclim.com|http://localhost:3000)") {
        set $cors_origin $http_origin;
    }

    # (Optional) Brotli if enabled in image
    # brotli on;
    # brotli_comp_level 4;
    # brotli_types application/json application/javascript text/plain;

    # -----------------------------
    # API endpoint: cached + rate-limited
    # -----------------------------
    location /api {
    # location / {
        # Rate limit expensive calls
        limit_req zone=api_limit burst=20 nodelay;

        # Enable CORS for preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            return 204;
        }

        # Remove upstream CORS so only NGINX controls it
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;

        # Add CORS headers for normal GET responses
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Headers * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

        # Add cache debug header
        add_header X-Cache-Status $upstream_cache_status always;

        # Enable caching
        proxy_cache api_cache;
        proxy_cache_key $scheme$proxy_host$uri$is_args$args;
        proxy_cache_valid 200 30m;
        proxy_cache_valid 404 1m;
        proxy_ignore_headers Cache-Control Pragma Expires;

        # Proxy to python app
        proxy_pass http://veclim-data-server:80;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Handling large JSON streams
        proxy_buffers 32 16k;
        proxy_busy_buffers_size 64k;
        proxy_buffer_size 16k;

        # Long-running time series ops
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # -----------------------------
    # Leave / untouched for UI, docs, health, etc.
    location / {
        proxy_pass http://veclim-data-server:80;
    }
}
