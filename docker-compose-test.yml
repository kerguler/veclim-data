services:
  veclim-data-server-test:
    container_name: veclim-data-server-test
    build:
      context: .
      args:
        VEC_PORTE: "${VEC_PORTE}"
    image: veclim-data-server-test
    restart: unless-stopped
    ports:
      - "${VEC_PORTE}:80"
    volumes:
      - "${VEC_DATA}:${DIR_DATA}"
    env_file:
      - .env
