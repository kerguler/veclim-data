# nginx.tiles.conf
worker_processes auto;
events { worker_connections 1024; }

http {
  sendfile on;
  tcp_nopush on;
  types_hash_max_size 4096;
  include       mime.types;
  default_type  application/octet-stream;

  # Small file descriptor cache for static tiles
  open_file_cache          max=10000 inactive=30s;
  open_file_cache_valid    60s;
  open_file_cache_min_uses 2;
  open_file_cache_errors   on;

  # Upstream to your Python app (for cache-misses)
  upstream veclim_backend {
    server veclim-data-server:80;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Optional CORS for tiles (enable if you serve tiles to other origins)
    set $cors_origin "*";
    if ($http_origin ~* "^https?://") { set $cors_origin $http_origin; }

    # ---- 1) Path-style tiles: /tiles/<v>/<z>/<x>/<y>.png served directly ----
    location ^~ /tiles/ {
      alias /data/tiles/;              # maps /tiles/* -> /data/tiles/*
      autoindex off;
      access_log off;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      add_header Access-Control-Allow-Origin "$cors_origin" always;
      add_header Access-Control-Allow-Credentials "true" always;
      try_files $uri =404;
    }

    # ---- 2) Query-style compatibility: "/?v=...&z=...&x=...&y=..." ----
    # If the cached file exists, serve it; otherwise proxy to Python.
    location = / {
      # build /tiles/<v>/<z>/<x>/<y>.png from query args
      set $tile_path /tiles/$arg_v/$arg_z/$arg_x/$arg_y.webp;
      try_files $tile_path @proxy_backend;
    }

    # You may also want a path endpoint that mirrors query style:
    # location ~ ^/tile/(.+?)/(\d+)/(\d+)/(\d+)\.(png|webp|jpg)$ {
    #   try_files /tiles/$1/$2/$3/$4.$5 @proxy_backend;
    # }

    # ---- Proxy fallback (cache-miss) ----
    location @proxy_backend {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # pass original querystring (& so Python can render a fresh tile)
      proxy_pass http://veclim_backend;

      # generous timeouts for heavy renders (tune as needed)
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 120s;
    }

    # (Optional) health check
    location = /healthz { return 200 "ok\n"; }
  }
}
