proxy_cache_path /var/cache/nginx/api_cache levels=1:2 keys_zone=api_cache:50m inactive=24h max_size=2g;

map $request_uri $api_cache_key {
    default $request_uri;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 80;

    # -----------------------------
    # Compression for JSON results
    # -----------------------------
    gzip on;
    gzip_types application/json application/javascript text/plain application/xml;
    gzip_min_length 1000;

    # (Optional) Brotli if enabled in image
    # brotli on;
    # brotli_comp_level 4;
    # brotli_types application/json application/javascript text/plain;

    # -----------------------------
    # API endpoint: cached + rate-limited
    # -----------------------------
    # location /api {
    location / {
        # Rate limit expensive calls
        limit_req zone=api_limit burst=20 nodelay;

        # CORS if Web dashboards use it
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Headers *;

        # Caching
        proxy_cache api_cache;
        proxy_cache_key $api_cache_key;
        proxy_cache_valid 200 302 30m;   # successful responses cached
        proxy_cache_valid 404 1m;        # failed tries briefly cached
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        # See caching HIT/MISS headers
        add_header X-Cache-Status $upstream_cache_status always;

        # Proxy to Python backend
        proxy_pass http://veclim-data-server:80;

        # Keep client away from Python internals
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Handling large JSON streams
        proxy_buffers 32 16k;
        proxy_busy_buffers_size 64k;
        proxy_buffer_size 16k;

        # Long-running time series ops
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # -----------------------------
    # Everything else → Python
    # e.g., tiles through API logic too
    # -----------------------------
    # location / {
    #     proxy_pass http://veclim-data-server:80;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
