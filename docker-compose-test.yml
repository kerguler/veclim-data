services:
  veclim-data-server-test:
    container_name: "${VEC_NAME}"
    build:
      context: .
      args:
        VEC_PORTE: "${VEC_PORTE}"
    image: "${VEC_NAME}"
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - "${VEC_DATA}:${DIR_DATA}"
    env_file:
      - .env

  veclim-data-server-test-nginx:
    image: nginx:stable
    container_name: "${VEC_NAME}-nginx"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache-test:/var/cache/nginx
    ports:
      - "${VEC_PORTE}:80"
    depends_on:
      - veclim-data-server-test

volumes:
  nginx_cache-test:
